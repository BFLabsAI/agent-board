target-version = "py38"

[lint]
# Regras explícitas: o conjunto padrão do ruff muda entre versões (0.17 ampliou)
# e o lint não pode quebrar sozinho quando sai uma versão nova.
select = ["E4", "E7", "E9", "F"]
# `l` para linha do log e lambdas curtas nos testes são o estilo do repo.
ignore = ["E741", "E731"]

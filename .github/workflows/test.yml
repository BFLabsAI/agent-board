name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-22.04  # 24.04 não tem Python 3.8 no setup-python
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/test_agent_board.py
      - run: python3 scripts/test_registro.py
      - run: python3 scripts/test_politica.py
      - run: python3 scripts/test_mcp.py
      - run: python3 scripts/test_time.py
      - run: python3 scripts/test_web.py
      - run: python3 scripts/test_federacao.py
      - run: python3 scripts/test_maestri.py
      - run: python3 scripts/test_docs.py
      - run: python3 scripts/test_contrato.py
      - run: python3 scripts/test_subagentes.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.17.0"
          args: check scripts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # o build é commitado em scripts/painel_web/ (quem instala a skill não precisa de Node); tem que estar em dia
      - run: test -z "$(git status --porcelain -- ../scripts/painel_web)" || (git status --short -- ../scripts/painel_web; echo "scripts/painel_web desatualizado: rode npm run build e commite"; exit 1)
